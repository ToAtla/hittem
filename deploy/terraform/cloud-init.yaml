#cloud-config
# Provisions the box to serve /srv/hittem over HTTPS. Content arrives separately:
# the GitHub Actions workflow rsyncs web/ into /srv/hittem on every push to main.

package_update: true
package_upgrade: false

packages:
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
  - rsync

users:
  - name: root
    lock_passwd: true
  # Owns /srv/hittem and nothing else. Deliberately not in sudo: a leaked deploy key
  # should get an attacker the ability to change the static site, not the machine.
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
%{ if deploy_authorized_key != "" ~}
      - ${deploy_authorized_key}
%{ endif ~}

write_files:
  - path: /etc/caddy/Caddyfile
    owner: root:root
    permissions: '0644'
    content: |
      ${indent(6, caddyfile)}

  # Serves something valid between the first boot and the first rsync, so the ACME
  # challenge and any health check have a document root that exists.
  - path: /srv/hittem/index.html
    owner: deploy:deploy
    permissions: '0644'
    content: |
      <!doctype html>
      <meta charset="utf-8">
      <title>Hittem</title>
      <p>Provisioned. Waiting for the first deploy.</p>

  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  - [ install, -d, -o, deploy, -g, deploy, -m, '0755', /srv/hittem ]
  - |
    set -eux
    curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key \
      | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt \
      > /etc/apt/sources.list.d/caddy-stable.list
    apt-get update
    apt-get install -y caddy
  - [ chown, '-R', 'deploy:deploy', /srv/hittem ]
  - [ caddy, validate, --config, /etc/caddy/Caddyfile ]
  - [ systemctl, enable, --now, caddy ]
  - [ systemctl, restart, ssh ]

final_message: "hittem-web ready. Caddy will obtain a certificate for ${site_domain} once DNS points here."
