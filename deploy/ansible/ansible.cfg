[defaults]
inventory = inventory.ini
host_key_checking = True
stdout_callback = yaml
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# The box sits behind CloudStack port forwarding on a shared public IP, so the host key
# changes whenever the instance is rebuilt behind the same address. That is expected;
# clear the stale entry with `ssh-keygen -R <ip>` rather than disabling host checking.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15
