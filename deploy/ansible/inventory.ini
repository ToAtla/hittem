; Public IP is the source NAT address of the guest network, exposed as the
; `public_ip` Terraform output. It belongs to the network rather than the instance,
; so it survives an instance rebuild.
;
; Provisioning connects as root with the CloudStack keypair. The deploy user this
; playbook creates is only for the GitHub Actions rsync and has no sudo.

